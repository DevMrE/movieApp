[versions]
# Build
agpVersion = "8.12.0"
# Kotlin
kotlinVersion = "2.3.10"
# AndroidX Basis
androidx-activity = "1.12.4"
androidx-appcompat = "1.7.1"
# Compose Multiplatform 1.10.0-beta02 Stack
composeVersion = "1.10.1"
material3Version = "1.10.0-alpha05"
materialAdaptiveVersion = "1.3.0-alpha05"
materialAdaptiveNavigationSuitVersion = "1.9.0"
# JetBrains-AndroidX (KMP Jetpack-Ports)
androidxLifecycleVersion = "2.9.6"
savedStateVersion = "1.4.0"
slf4jSimpleVersion = "2.0.17"
windowCoreVersion = "1.5.1"
composeHotReload = "1.0.0"
# other
koinVersion = "4.1.1"
ktorVersion = "3.4.0"
loggerVersion = "2.0.8"
kamelVersion = "1.0.9"
kmpNavigationVersion = "1.3.0-alpha15"
kotlinTest = "2.3.0"
runner = "1.7.0"
core = "1.7.0"
junit = "1.3.0"
androidConscryptVer = "2.5.3"

[libraries]
# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinVersion" }
# AndroidX / Jetpack
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
# JetBrains AndroidX Lifecycle
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycleVersion" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycleVersion" }
# SavedState & Window
savedState = { module = "org.jetbrains.androidx.savedstate:savedstate", version.ref = "savedStateVersion" }
window-core = { module = "org.jetbrains.androidx.window:window-core", version.ref = "windowCoreVersion" }
# SLF
slf4j = { module = "org.slf4j:slf4j-simple", version.ref = "slf4jSimpleVersion" }
# Koin
koinCore = { group = "io.insert-koin", name = "koin-core", version.ref = "koinVersion" }
koinCompose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koinVersion" }
koinCoreViewModel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koinVersion" }
koinCoreNavigation = { group = "io.insert-koin", name = "koin-compose-viewmodel-navigation", version.ref = "koinVersion" }
# Ktor
ktorCore = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktorVersion" }
ktorLogging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktorVersion" }
ktorNegotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktorVersion" }
ktorGson = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktorVersion" }
ktorBomRemover = { group = "io.ktor", name = "ktor-client-bom-remover", version.ref = "ktorVersion" }
ktorAuth = { group = "io.ktor", name = "ktor-client-auth", version.ref = "ktorVersion" }
ktorOkHttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktorVersion" }
ktorDarwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktorVersion" }
ktorResource = { group = "io.ktor", name = "ktor-client-resources", version.ref = "ktorVersion" }
# Logging
logger = { group = "co.touchlab", name = "kermit", version.ref = "loggerVersion" }
# Image Loading
kamel = { module = "media.kamel:kamel-image-default", version.ref = "kamelVersion" }
# KmpNavigation
kmpNavigation = { module = "com.github.devmre:navigation", version.ref = "kmpNavigationVersion" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlinTest" }
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junit" }
android-conscrypt = { module = "org.conscrypt:conscrypt-android", version.ref = "androidConscryptVer" }
composeUi = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeVersion" }
composeRuntime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeVersion" }
composePreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeVersion" }
composeFoundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeVersion" }
composeResources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeVersion" }
material = { module = "org.jetbrains.compose.material:material", version.ref = "composeVersion" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3Version" }
material3Adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "materialAdaptiveVersion" }
material3AdaptiveNavigation = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "materialAdaptiveNavigationSuitVersion" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agpVersion" }
androidLibrary = { id = "com.android.library", version.ref = "agpVersion" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agpVersion" }
androidLint = { id = "com.android.lint", version.ref = "agpVersion" }
# Compose Multiplatform Gradle Plugin
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeVersion" }
# Compose Compiler Plugin (K2)
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinVersion" }
# Kotlin Multiplatform & Co.
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlinVersion" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinVersion" }
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlinVersion" }
# Compose Hot Reload
composeHotReload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }

[bundles]
lifecycle = ["androidx-lifecycle-runtimeCompose", "androidx-lifecycle-viewmodelCompose"]
commainMainKoin = ["koinCore", "koinCoreViewModel", "koinCoreNavigation", "koinCompose"]
commonMainKtor = ["ktorCore", "ktorLogging", "ktorNegotiation", "ktorAuth", "ktorResource", "ktorGson", "ktorBomRemover"]
commonMainCompose = ["composeUi", "composeRuntime", "composePreview", "composeFoundation", "composeResources", "material", "material3", "material3Adaptive", "material3AdaptiveNavigation"]